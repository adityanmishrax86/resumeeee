services:
  db:
    image: postgres:16-alpine
    container_name: jobcopilot-db
    environment:
      POSTGRES_USER: jobcopilot
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: jobcopilot
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount migrations so they run automatically when the database starts for the first time
      - ./backend/app/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobcopilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobcopilot-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://jobcopilot:changeme@db:5432/jobcopilot
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_LLM_MODEL: ${GOOGLE_LLM_MODEL:-gemini-2.5-flash-preview}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
    volumes:
      - ./backend/app:/srv/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobcopilot-frontend
    command: npm run dev -- --host
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  ollama:
    image: ollama/ollama:latest
    container_name: jobcopilot-ollama
    profiles:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  ollama_data:
